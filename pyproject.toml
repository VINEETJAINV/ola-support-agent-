[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ola-support-agent"
version = "0.1.0"
description = "Ola Domain Support Agent (CrewAI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai==1.15.35",
    "chromadb==1.5.9",
    "sentence-transformers==6.2.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.16.2",
    "langchain==1.4.9",
    "langchain-community==0.4.2",
    "autogen-agentchat==0.7.5",
    "autogen-ext==0.7.5",
    "autogen-core==0.7.5",
    "python-dotenv==1.2.4",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.0",
    "mypy==1.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ola_support_agent*"]

[tool.setuptools.package-data]
ola_support_agent = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]